<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu-Bridge Business Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f111a;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            color: #f3f4f6;
            text-align: center;
        }

        p.subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
            font-size: 1.05rem;
            text-align: center;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 50px;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        .card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* 3:2 Business Card Aspect Ratio (e.g. 600px x 400px) */
        .card {
            width: 600px;
            height: 380px;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(212, 175, 55, 0.25);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        /* Decorative Geometric Gold Art */
        .card::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.15);
            pointer-events: none;
        }

        .card::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.1);
            pointer-events: none;
        }

        .gold-accent-corner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 90% 10%, rgba(212, 175, 55, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 10% 90%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
            pointer-events: none;
        }

        /* --- FRONT SIDE --- */
        .front-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 2;
        }

        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(212, 175, 55, 0.3));
            margin-bottom: 12px;
        }

        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.2);
        }

        .brand-tagline {
            font-size: 1.35rem;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #d4af37, #fff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- BACK SIDE --- */
        .back-card {
            justify-content: space-between;
            padding: 24px 30px;
        }

        .team-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-align: center;
            z-index: 2;
            margin-bottom: 12px;
            position: relative;
        }

        .team-grid {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 2;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 40px;
        }

        .team-row.center-row {
            justify-content: center;
        }

        .team-member {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Yellow Accent Line */
        .yellow-line {
            width: 85%;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, #ffd700 50%, transparent 100%);
            margin: 12px 0;
            z-index: 2;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Contact Section */
        .contact-section {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            padding: 0 20px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: right;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: #e2e8f0;
            direction: ltr;
            justify-content: flex-end;
        }

        .contact-item span {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        .contact-icon {
            color: #ffd700;
            font-size: 1.1rem;
        }

        .qr-container {
            width: 75px;
            height: 75px;
            background: #ffffff;
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 0 2px #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-download {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #0b132b;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
        }
    </style>
</head>
<body>

    <h1>بطاقات أعمال Edu-Bridge الرسمية</h1>
    <p class="subtitle">تصميم احترافي جاهز للطباعة والتنزيل بوجهيه الأمامي والخلفي</p>

    <div class="cards-container">
        
        <!-- FRONT CARD -->
        <div class="card-wrapper">
            <h2 style="font-size: 1.2rem; color: #ffd700;">الوجه الأمامي (Front)</h2>
            <div class="card" id="frontCard">
                <div class="gold-accent-corner"></div>
                <div class="front-content">
                    <img src="logo.png" alt="Edu-Bridge Logo" class="logo-img">
                    <div class="brand-name">Edu-Bridge</div>
                    <div class="brand-tagline">إدارة المؤسسات التعليمية</div>
                </div>
            </div>
            <button class="btn-download" onclick="downloadCard('frontCard', 'EduBridge_Card_Front.png')">📥 تحميل الوجه الأمامي</button>
        </div>

        <!-- BACK CARD -->
        <div class="card-wrapper">
            <h2 style="font-size: 1.2rem; color: #ffd700;">الوجه الخلفي (Back)</h2>
            <div class="card back-card" id="backCard">
                <div class="gold-accent-corner"></div>
                
                <!-- Team Section -->
                <div class="team-title">فريق التطوير</div>
                
                <div class="team-grid">
                    <!-- Row 1: Right & Left -->
                    <div class="team-row">
                        <div class="team-member">مجدولين محمود</div>
                        <div class="team-member">محمود غنام</div>
                    </div>
                    <!-- Row 2: Right & Left -->
                    <div class="team-row">
                        <div class="team-member">إسراء منور</div>
                        <div class="team-member">هبة عيسى</div>
                    </div>
                    <!-- Row 3: Center -->
                    <div class="team-row center-row">
                        <div class="team-member">شهد زريقي</div>
                    </div>
                </div>

                <!-- Yellow Accent Line -->
                <div class="yellow-line"></div>

                <!-- Contact & QR Code -->
                <div class="contact-section">
                    <div class="contact-info">
                        <div class="contact-item">
                            <span>edubridge2006@gmail.com</span>
                            <span class="contact-icon">✉</span>
                        </div>
                        <div class="contact-item">
                            <span>+963959031594</span>
                            <span class="contact-icon">📱</span>
                        </div>
                    </div>
                    <div class="qr-container">
                        <img src="qr_code.png" alt="Website QR Code" class="qr-img">
                    </div>
                </div>

            </div>
            <button class="btn-download" onclick="downloadCard('backCard', 'EduBridge_Card_Back.png')">📥 تحميل الوجه الخلفي</button>
        </div>

    </div>

    <script>
        function downloadCard(cardId, filename) {
            const cardElem = document.getElementById(cardId);
            html2canvas(cardElem, {
                scale: 3, // High resolution (3x scale)
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = filename;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
